name: Build Kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Dependencies and Fix Libgcc
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache curl flex g++-multilib gcc-multilib git gnupg gperf lib32readline-dev lib32z1-dev liblz4-tool libncurses5-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev libgcc-s1 wget

      - name: Setup Samsung Clang Toolchain
        run: |
          cd ..
          mkdir -p toolchain_samsung_sm8750/kernel_platform/prebuilts/clang/host/linux-x86
          cd toolchain_samsung_sm8750/kernel_platform/prebuilts/clang/host/linux-x86
          git clone --depth=1 https://github.com -b main clang-r510928 || true
          mkdir -p clang-r510928/bin
          ln -s /usr/bin/clang clang-r510928/bin/clang
          ln -s /usr/bin/ld.lld clang-r510928/bin/ld.lld
          ln -s /usr/bin/llvm-objdump clang-r510928/bin/llvm-objdump

      - name: Build Kernel
        run: |
          chmod +x build/build.sh
          build/build.sh lkm PACK=1
